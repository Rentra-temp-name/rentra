[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rentra-api"
version = "0.1.0"
description = "Rentra marketplace API"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.143,<0.144"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
